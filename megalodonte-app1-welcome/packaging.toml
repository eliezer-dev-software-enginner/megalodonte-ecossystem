schema_version = 1

[app]
name = "Megalodonte Welcome"
version = "0.1.0"
main_class = "megalodonte_app1_welcome.Main"
icon_linux = "src/main/resources/icon.png"

[build]
mode = "distribution"
tasks = ["installDist"]
jar = "build/install/megalodonte-app1-welcome/lib/megalodonte-app1-welcome-{version}.jar"

[javafx]
version = "25.0.1"

[runtime]
modules = ["javafx.controls", "java.logging", "java.xml", "jdk.charsets"]
exclude_natives = ["libjfxwebkit.so", "libjfxmedia.so", "jfxwebkit.dll"]

[linux]
package_name = "megalodonte-app1-welcome"
menu_group = "Office"
