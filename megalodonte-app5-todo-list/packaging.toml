schema_version = 1

[app]
name = "Megalodonte Todo List"
version = "0.1.0"
main_class = "megalodonte_app5_todo_list.Main"
icon_linux = "src/main/resources/icon.png"

[build]
mode = "distribution"
tasks = ["installDist"]
jar = "build/install/megalodonte-app5-todo-list/lib/megalodonte-app5-todo-list-{version}.jar"

[javafx]
version = "25.0.1"

[runtime]
modules = ["javafx.controls", "java.logging", "java.xml", "jdk.charsets"]
exclude_natives = ["libjfxwebkit.so", "libjfxmedia.so", "jfxwebkit.dll"]

[linux]
package_name = "megalodonte-app5-todo-list"
menu_group = "Office"
