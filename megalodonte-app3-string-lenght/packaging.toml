schema_version = 1

[app]
name = "Megalodonte String Length"
version = "0.1.0"
main_class = "megalodonte_app3_string_lenght.Main"
icon_linux = "src/main/resources/icon.png"

[build]
mode = "distribution"
tasks = ["installDist"]
jar = "build/install/megalodonte-app3-string-lenght/lib/megalodonte-app3-string-lenght-{version}.jar"

[javafx]
version = "25.0.1"

[runtime]
modules = ["javafx.controls", "java.logging", "java.xml", "jdk.charsets"]
exclude_natives = ["libjfxwebkit.so", "libjfxmedia.so", "jfxwebkit.dll"]

[linux]
package_name = "megalodonte-app3-string-lenght"
menu_group = "Office"
